<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dylan's Baseball Career</title>
    <style>
        :root {
            --primary: #16a34a;
            --primary-hover: #15803d;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .site-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #6b7280;
            padding-bottom: 16px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .site-nav a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .site-nav a:hover {
            text-decoration: underline;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background-color: #dcfce7;
            color: var(--primary);
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .counter {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .counter button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: #f9fafb;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .counter button:active {
            background: #e5e7eb;
        }

        .counter span {
            font-size: 18px;
            font-weight: bold;
            min-width: 24px;
            text-align: center;
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .save-btn:hover {
            background-color: #059669;
        }

        .save-btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .history-card {
            border-left: 4px solid var(--primary);
            margin-bottom: 15px;
        }

        .history-header {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .history-sub {
            color: #6b7280;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .history-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 0.95em;
            margin-bottom: 12px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border);
            background: #f9fafb;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-action.edit:hover {
            background: #dcfce7;
            color: var(--primary);
        }

        .btn-action.delete {
            color: var(--danger);
        }

        .btn-action.delete:hover {
            background: #fee2e2;
        }

        .empty-state {
            text-align: center;
            color: #9ca3af;
            padding: 40px 0;
        }

        .loading-state {
            text-align: center;
            color: var(--primary);
            padding: 40px 0;
        }

        .firebase-warning {
            display: none;
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fcd34d;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .firebase-warning.active {
            display: block;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
        }

        .modal h3 {
            margin-top: 0;
            color: var(--text);
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border);
            background: #f9fafb;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel:hover {
            background: #e5e7eb;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="site-nav">
        <a href="index.html">← Velasquez Sports</a>
        <a href="olivia-vball-tracker.html">Olivia's Volleyball →</a>
    </div>

    <h1>⚾ Dylan's Baseball Career</h1>

    <div id="firebaseWarning" class="firebase-warning">
        ⚠️ Could not connect to Firebase. Counters will still work, but Save/History won't until this is fixed.
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('tracker', event)">Track Game</button>
        <button class="tab-btn" onclick="switchTab('history', event)">History</button>
    </div>

    <!-- Tracker View -->
    <div id="tracker" class="tab-content active">
        <form class="card" onsubmit="saveGame(event)">
            <div class="form-group">
                <label for="gameDate">Date & Time</label>
                <input type="datetime-local" id="gameDate" required>
            </div>

            <div class="form-group">
                <label for="gameLocation">Location / Opponent</label>
                <input type="text" id="gameLocation" placeholder="e.g., Home vs Rockets" required>
            </div>

            <div class="stat-row">
                <span>Runs</span>
                <div class="counter">
                    <button type="button" onclick="updateStat('runs', -1)">-</button>
                    <span id="runs">0</span>
                    <button type="button" onclick="updateStat('runs', 1)">+</button>
                </div>
            </div>
            <div class="stat-row">
                <span>Outs</span>
                <div class="counter">
                    <button type="button" onclick="updateStat('outs', -1)">-</button>
                    <span id="outs">0</span>
                    <button type="button" onclick="updateStat('outs', 1)">+</button>
                </div>
            </div>
            <div class="stat-row">
                <span>Bases</span>
                <div class="counter">
                    <button type="button" onclick="updateStat('bases', -1)">-</button>
                    <span id="bases">0</span>
                    <button type="button" onclick="updateStat('bases', 1)">+</button>
                </div>
            </div>
            <div class="stat-row">
                <span>RBI</span>
                <div class="counter">
                    <button type="button" onclick="updateStat('rbi', -1)">-</button>
                    <span id="rbi">0</span>
                    <button type="button" onclick="updateStat('rbi', 1)">+</button>
                </div>
            </div>

            <button type="submit" class="save-btn">Save Game & Reset Tracker</button>
        </form>
    </div>

    <!-- History View -->
    <div id="history" class="tab-content">
        <div id="historyList"></div>
    </div>
</div>

<!-- Edit Game Modal -->
<div id="editModal" class="modal-overlay">
    <div class="modal">
        <h3>Edit Saved Game</h3>
        <form id="editForm" onsubmit="submitEdit(event)">
            <input type="hidden" id="editGameId">
            <div class="form-group">
                <label for="editDate">Date & Time</label>
                <input type="datetime-local" id="editDate" required>
            </div>
            <div class="form-group">
                <label for="editLocation">Location / Opponent</label>
                <input type="text" id="editLocation" required>
            </div>

            <div class="stat-row">
                <span>Runs</span>
                <div class="counter">
                    <button type="button" onclick="updateEditStat('runs', -1)">-</button>
                    <span id="edit_runs">0</span>
                    <button type="button" onclick="updateEditStat('runs', 1)">+</button>
                </div>
            </div>
            <div class="stat-row">
                <span>Outs</span>
                <div class="counter">
                    <button type="button" onclick="updateEditStat('outs', -1)">-</button>
                    <span id="edit_outs">0</span>
                    <button type="button" onclick="updateEditStat('outs', 1)">+</button>
                </div>
            </div>
            <div class="stat-row">
                <span>Bases</span>
                <div class="counter">
                    <button type="button" onclick="updateEditStat('bases', -1)">-</button>
                    <span id="edit_bases">0</span>
                    <button type="button" onclick="updateEditStat('bases', 1)">+</button>
                </div>
            </div>
            <div class="stat-row">
                <span>RBI</span>
                <div class="counter">
                    <button type="button" onclick="updateEditStat('rbi', -1)">-</button>
                    <span id="edit_rbi">0</span>
                    <button type="button" onclick="updateEditStat('rbi', 1)">+</button>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button type="submit" class="save-btn" style="margin-top:0">Update Game</button>
            </div>
        </form>
    </div>
</div>

<!-- Firebase Compat Scripts (corrected filenames — no "firebase-compat/" subfolder) -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

<script>
    // Declare state up front so counter buttons work even if Firebase fails to load.
    let stats = { runs: 0, outs: 0, bases: 0, rbi: 0 };
    let editStats = { runs: 0, outs: 0, bases: 0, rbi: 0 };
    let gamesRef = null;

    // ========== PASTE YOUR FIREBASE CONFIG HERE ==========
    const firebaseConfig = {
        apiKey: "AIzaSyBoQQxPu8FoDER0fmFNziaokM71xarbCqM",
        authDomain: "dylan-baseball.firebaseapp.com",
        databaseURL: "https://dylan-baseball-default-rtdb.firebaseio.com",
        projectId: "dylan-baseball",
        storageBucket: "dylan-baseball.firebasestorage.app",
        messagingSenderId: "49979650551",
        appId: "1:49979650551:web:d05880ad31dccc8fc4fef2",
        measurementId: "G-V353JPBS24"
    };
    // ====================================================

    // Initialize Firebase — wrapped so a load/config failure can't take down the whole page.
    try {
        if (typeof firebase === 'undefined') {
            throw new Error('Firebase SDK scripts did not load.');
        }
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        gamesRef = db.ref('games');
    } catch (err) {
        console.error('Firebase failed to initialize:', err);
        document.getElementById('firebaseWarning').classList.add('active');
    }

    document.getElementById('gameDate').value = new Date().toISOString().slice(0, 16);

    function updateStat(statKey, change) {
        stats[statKey] = Math.max(0, stats[statKey] + change);
        document.getElementById(statKey).innerText = stats[statKey];
    }

    function updateEditStat(statKey, change) {
        editStats[statKey] = Math.max(0, editStats[statKey] + change);
        document.getElementById('edit_' + statKey).innerText = editStats[statKey];
    }

    function switchTab(tabName, evt) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

        document.getElementById(tabName).classList.add('active');
        if (evt) evt.currentTarget.classList.add('active');

        if (tabName === 'history') {
            renderHistory();
        }
    }

    function requireFirebase() {
        if (!gamesRef) {
            alert('Firebase is not connected, so this action is unavailable right now. Check your Firebase config/network.');
            return false;
        }
        return true;
    }

    function saveGame(event) {
        event.preventDefault();
        if (!requireFirebase()) return;

        const location = document.getElementById('gameLocation').value.trim();
        const date = document.getElementById('gameDate').value;

        if (!location) return;

        const saveBtn = event.target.querySelector('.save-btn');
        saveBtn.disabled = true;
        saveBtn.innerText = 'Saving...';

        const gameId = String(Date.now());
        const gameObject = {
            date: date,
            location: location,
            stats: { ...stats }
        };

        gamesRef.child(gameId).set(gameObject).then(() => {
            stats = { runs: 0, outs: 0, bases: 0, rbi: 0 };
            Object.keys(stats).forEach(key => document.getElementById(key).innerText = 0);
            document.getElementById('gameLocation').value = '';
            document.getElementById('gameDate').value = new Date().toISOString().slice(0, 16);

            saveBtn.disabled = false;
            saveBtn.innerText = 'Save Game & Reset Tracker';
            alert('Game saved successfully!');
        }).catch(error => {
            console.error('Error saving game:', error);
            saveBtn.disabled = false;
            saveBtn.innerText = 'Save Game & Reset Tracker';
            alert('Error saving game. Please check your Firebase config.');
        });
    }

    function renderHistory() {
        const historyContainer = document.getElementById('historyList');

        if (!gamesRef) {
            historyContainer.innerHTML = '<div class="empty-state">Firebase is not connected, so history is unavailable.</div>';
            return;
        }

        historyContainer.innerHTML = '<div class="loading-state">Loading games...</div>';

        gamesRef.once('value', (snapshot) => {
            const games = [];
            snapshot.forEach(childSnapshot => {
                games.push({
                    id: childSnapshot.key,
                    ...childSnapshot.val()
                });
            });

            if (games.length === 0) {
                historyContainer.innerHTML = '<div class="empty-state">No saved games found yet.</div>';
                return;
            }

            // Sort by date descending (newest first)
            games.sort((a, b) => new Date(b.date) - new Date(a.date));

            historyContainer.innerHTML = games.map(game => {
                const formattedDate = new Date(game.date).toLocaleString([], {
                    dateStyle: 'medium',
                    timeStyle: 'short'
                });

                return `
                    <div class="card history-card">
                        <div class="history-header">${game.location}</div>
                        <div class="history-sub">${formattedDate}</div>
                        <div class="history-stats">
                            <div><strong>Runs:</strong> ${game.stats.runs}</div>
                            <div><strong>Outs:</strong> ${game.stats.outs}</div>
                            <div><strong>Bases:</strong> ${game.stats.bases}</div>
                            <div><strong>RBI:</strong> ${game.stats.rbi}</div>
                        </div>
                        <div class="card-actions">
                            <button type="button" class="btn-action edit" onclick="openEditModal('${game.id}')">Edit</button>
                            <button type="button" class="btn-action delete" onclick="deleteGame('${game.id}')">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }).catch(error => {
            console.error('Error loading games:', error);
            historyContainer.innerHTML = '<div class="empty-state">Error loading games. Check your Firebase config.</div>';
        });
    }

    function deleteGame(id) {
        if (!requireFirebase()) return;
        if (!confirm("Are you sure you want to delete this game?")) return;

        gamesRef.child(id).remove().then(() => {
            renderHistory();
        }).catch(error => {
            console.error('Error deleting game:', error);
            alert('Error deleting game.');
        });
    }

    function openEditModal(id) {
        if (!requireFirebase()) return;

        gamesRef.child(id).once('value', (snapshot) => {
            const game = snapshot.val();
            if (!game) return;

            document.getElementById('editGameId').value = id;
            document.getElementById('editDate').value = game.date;
            document.getElementById('editLocation').value = game.location;

            editStats = { ...game.stats };
            Object.keys(editStats).forEach(key => {
                document.getElementById('edit_' + key).innerText = editStats[key];
            });

            document.getElementById('editModal').classList.add('active');
        });
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('active');
    }

    function submitEdit(event) {
        event.preventDefault();
        if (!requireFirebase()) return;

        const id = document.getElementById('editGameId').value;
        const submitBtn = event.target.querySelector('.save-btn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'Updating...';

        const updateData = {
            date: document.getElementById('editDate').value,
            location: document.getElementById('editLocation').value.trim(),
            stats: { ...editStats }
        };

        gamesRef.child(id).set(updateData).then(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Update Game';
            closeEditModal();
            renderHistory();
        }).catch(error => {
            console.error('Error updating game:', error);
            submitBtn.disabled = false;
            submitBtn.innerText = 'Update Game';
            alert('Error updating game.');
        });
    }
</script>

</body>
</html>
