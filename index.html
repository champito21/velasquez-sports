<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velasquez Sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --scoreboard: #10161b;
    --scoreboard-raised: #171f26;
    --chalk: #f4f2ec;
    --chalk-dim: #9aa3ab;
    --volleyball: #4f46e5;
    --volleyball-dim: #35306b;
    --baseball: #16a34a;
    --baseball-dim: #1f4a30;
    --dirt: #c2894f;
    --line: rgba(244, 242, 236, 0.1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--scoreboard);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 0;
    border-bottom: 1px solid var(--line);
    margin-bottom: 64px;
  }

  .brand {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    color: var(--chalk);
  }

  .brand span { color: var(--dirt); }

  .season {
    font-size: 0.85rem;
    color: var(--chalk-dim);
    font-variant-numeric: tabular-nums;
  }

  .hero {
    text-align: center;
    margin-bottom: 72px;
  }

  .hero h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 8vw, 4.4rem);
    line-height: 1.02;
    margin: 0 0 18px;
    letter-spacing: 0.01em;
    color: var(--chalk);
  }

  .hero p {
    font-size: 1.05rem;
    color: var(--chalk-dim);
    max-width: 460px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .roster {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  @media (max-width: 640px) {
    .roster { grid-template-columns: 1fr; }
    header.top { margin-bottom: 48px; }
    .hero { margin-bottom: 48px; }
  }

  .card {
    position: relative;
    display: block;
    text-decoration: none;
    color: var(--chalk);
    border-radius: 6px;
    padding: 36px 28px 30px;
    overflow: hidden;
    isolation: isolate;
    border: 1px solid var(--line);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .card:hover, .card:focus-visible {
    transform: translateY(-2px);
  }

  .card:focus-visible {
    outline: 2px solid var(--chalk);
    outline-offset: 3px;
  }

  .card.volleyball { background: linear-gradient(165deg, var(--volleyball) 0%, var(--volleyball-dim) 100%); }
  .card.baseball  { background: linear-gradient(165deg, var(--baseball) 0%, var(--baseball-dim) 100%); }

  .card .initial {
    position: absolute;
    right: -6px;
    bottom: -28px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 9rem;
    line-height: 1;
    color: rgba(244, 242, 236, 0.1);
    z-index: -1;
    user-select: none;
  }

  .card .sport-icon {
    font-size: 1.8rem;
    margin-bottom: 20px;
    display: block;
  }

  .card .name {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 1.5rem;
    margin: 0 0 4px;
  }

  .card .sport {
    font-size: 0.95rem;
    color: rgba(244, 242, 236, 0.75);
    margin: 0 0 28px;
  }

  .card .cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--chalk);
    border-top: 1px solid rgba(244, 242, 236, 0.25);
    padding-top: 14px;
    width: 100%;
  }

  .card .cta svg {
    width: 14px;
    height: 14px;
    transition: transform 0.15s ease;
  }

  .card:hover .cta svg {
    transform: translateX(3px);
  }

  footer {
    text-align: center;
    margin-top: 72px;
    font-size: 0.85rem;
    color: var(--chalk-dim);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">Velasquez <span>Sports</span></div>
      <div class="season">2026–27 Season</div>
    </header>

    <div class="hero">
      <h1>Velasquez Sports</h1>
      <p>Tracking every serve, run, and everything in between for the family roster.</p>
    </div>

    <div class="roster">
      <a class="card volleyball" href="olivia-vball-tracker.html">
        <span class="initial">O</span>
        <span class="sport-icon">🏐</span>
        <p class="name">Olivia Velasquez</p>
        <p class="sport">Volleyball</p>
        <span class="cta">
          View stats
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </span>
      </a>

      <a class="card baseball" href="dylan-baseball-tracker.html">
        <span class="initial">D</span>
        <span class="sport-icon">⚾</span>
        <p class="name">Dylan Velasquez</p>
        <p class="sport">Baseball</p>
        <span class="cta">
          View stats
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </span>
      </a>
    </div>

    <footer>Built for two very busy game schedules.</footer>
  </div>
</body>
</html>
